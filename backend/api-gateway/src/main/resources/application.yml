server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: assessments-route
              uri: lb://business-service
              predicates:
                - Path=/api/assessments, /api/assessments/**

            - id: gis-route
              uri: lb://business-service
              predicates:
                - Path=/api/gis/**

            - id: districts-route
              uri: lb://business-service
              predicates:
                - Path=/api/districts, /api/districts/**

            - id: analytics-route
              uri: lb://business-service
              predicates:
                - Path=/api/analytics/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/